doctrine:
  dbal:
    url: '%env(resolve:DATABASE_URL)%'

    # IMPORTANT: You MUST configure your server version,
    # either here or in the DATABASE_URL env var (see .env file)
    #server_version: '16'

    profiling_collect_backtrace: '%kernel.debug%'
  orm:
    validate_xml_mapping: true
    naming_strategy: doctrine.orm.naming_strategy.underscore
    identity_generation_preferences:
      Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
    auto_mapping: false
    #        mappings:
    #            App:
    #                type: attribute
    #                is_bundle: false
    #                dir: '%kernel.project_dir%/src/Entity'
    #                prefix: 'App\Entity'
    #                alias: App
    mappings:
      LiveTimerSession:
        type: attribute
        dir: '%kernel.project_dir%/src/Feature/LiveTimerSession/Entity'
        prefix: 'App\Feature\LiveTimerSession\Entity'

      Note:
        type: attribute
        dir: '%kernel.project_dir%/src/Feature/Note/Entity'
        prefix: 'App\Feature\Note\Entity'

      Resource:
        type: attribute
        dir: '%kernel.project_dir%/src/Feature/Resource/Entity'
        prefix: 'App\Feature\Resource\Entity'

      Subject:
        type: attribute
        dir: '%kernel.project_dir%/src/Feature/Subject/Entity'
        prefix: 'App\Feature\Subject\Entity'

      Tag:
        type: attribute
        dir: '%kernel.project_dir%/src/Feature/Tag/Entity'
        prefix: 'App\Feature\Tag\Entity'

      Task:
        type: attribute
        dir: '%kernel.project_dir%/src/Feature/Task/Entity'
        prefix: 'App\Feature\Task\Entity'

      User:
        type: attribute
        dir: '%kernel.project_dir%/src/Feature/User/Entity'
        prefix: 'App\Feature\User\Entity'

when@test:
  doctrine:
    dbal:
      # "TEST_TOKEN" is typically set by ParaTest
      dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
  doctrine:
    orm:
      query_cache_driver:
        type: pool
        pool: doctrine.system_cache_pool
      result_cache_driver:
        type: pool
        pool: doctrine.result_cache_pool

  framework:
    cache:
      pools:
        doctrine.result_cache_pool:
          adapter: cache.app
        doctrine.system_cache_pool:
          adapter: cache.system
