monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - api
        - doctrine
        - security
        - messenger

when@dev:
    monolog:
        handlers:

            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]

            api:
                type: stream
                path: "%kernel.logs_dir%/api.%kernel.environment%.log"
                level: debug
                channels: [ "api" ]

            doctrine:
                type: stream
                path: "%kernel.logs_dir%/doctrine.%kernel.environment%.log"
                level: debug
                channels: [ "doctrine" ]

            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@prod:
    monolog:
        handlers:

            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]

            nested:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: warning
                max_files: 30

            api:
                type: rotating_file
                path: "%kernel.logs_dir%/api.%kernel.environment%.log"
                level: warning
                max_files: 30
                channels: [ "api" ]
