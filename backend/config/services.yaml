# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  #    app.locale: 'en'
  app.timezone: 'Europe/Brussels'

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true      # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: '../src/'

  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones

  App\Feature\LiveTimerSession\Service\Store:
    arguments:
      $cache: '@cache.live_timer_sessions'

  App\Feature\User\Factory\SettingsFactory:
    arguments:
      $defaultTimezone: '%app.timezone%'

  App\StudyContent\Application\Port\ContentItemIdentityGenerator:
    class: App\StudyContent\Infrastructure\Persistence\Doctrine\Identity\UuidContentItemIdentityGenerator

  App\StudyContent\Application\Port\CollectionIdentityGenerator:
    class: App\StudyContent\Infrastructure\Persistence\Doctrine\Identity\UuidCollectionIdentityGenerator

  App\StudyContent\Domain\Repository\ContentItemRepository:
    class: App\StudyContent\Infrastructure\Persistence\Doctrine\Repository\DoctrineContentItemRepository

  App\StudyContent\Domain\Repository\CollectionRepository:
    class: App\StudyContent\Infrastructure\Persistence\Doctrine\Repository\DoctrineCollectionRepository

  App\StudyContent\Infrastructure\Persistence\Doctrine\Mapper\ContentItemMapper:
    class: App\StudyContent\Infrastructure\Persistence\Doctrine\Mapper\DoctrineContentItemMapper

  App\StudyContent\Infrastructure\Persistence\Doctrine\Mapper\CollectionMapper:
    class: App\StudyContent\Infrastructure\Persistence\Doctrine\Mapper\DoctrineCollectionMapper

  App\StudyContent\Application\Port\TransactionRunner:
    class: App\StudyContent\Infrastructure\Persistence\Doctrine\Transaction\DoctrineTransactionRunner

  #EventBus && BinaryAssetGateway
