name: ${COMPOSE_PROJECT_NAME:-studybuddy}

#####################
# SHARED EXTENSIONS #
#####################
x-user: &user
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

x-net: &net
  networks:
    - app_net

x-health-defaults: &health-defaults
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 20s

#################
# DATABASE BASE #
#################
x-db-base: &db-base
  image: "mysql:${MYSQL_VERSION:-8.0.32}"
  environment:
    MYSQL_ROOT_PASSWORD:  "${MYSQL_ROOT_PASSWORD:-root}"
    MYSQL_USER:           "${MYSQL_USER:-app}"
    MYSQL_PASSWORD:       "${MYSQL_PASSWORD:-app}"
    MYSQL_DATABASE:       "app_${APP_ENV:-dev}"
  command:
    - --default-authentication-plugin=mysql_native_password
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
  healthcheck:
    <<: *health-defaults
    test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
  <<: *net

############
# PHP BASE #
############
x-php-common: &php-common
  working_dir: /app/backend
  init: true
  <<: [*user, *net]
  env_file:
    - ./docker/environment/.env.local.${APP_ENV:-dev}
  environment:
    COMPOSER_HOME: /tmp/.config
    XDG_CONFIG_HOME: /tmp/.config
    COMPOSER_CACHE_DIR: /app/backend/.composer-cache

x-build-dev: &build-dev
  build:
    context: .
    dockerfile: ./docker/php/Dockerfile
    target: php-dev
    args:
      PHP_VERSION: "${PHP_VERSION:-8.4.18}"
      COMPOSER_VERSION: "${COMPOSER_VERSION:-2.9.5}"
      NODE_VERSION: "${NODE_VERSION:-22-alpine}"

x-build-test: &build-test
  build:
    context: .
    dockerfile: ./docker/php/Dockerfile
    target: php-test
    args:
      PHP_VERSION: "${PHP_VERSION:-8.4.18}"
      COMPOSER_VERSION: "${COMPOSER_VERSION:-2.9.5}"
      NODE_VERSION: "${NODE_VERSION:-22-alpine}"

x-build-prod: &build-prod
  build:
    context: .
    dockerfile: ./docker/php/Dockerfile
    target: php-prod
    args:
      PHP_VERSION: "${PHP_VERSION:-8.4.18}"
      COMPOSER_VERSION: "${COMPOSER_VERSION:-2.9.5}"
      NODE_VERSION: "${NODE_VERSION:-22-alpine}"
#############
# NODE BASE #
#############
x-node-common: &node-common
  image: "node:${NODE_VERSION:-22-alpine}"
  working_dir: /app/frontend
  init: true
  <<: [*user, *net]
  environment:
    VITE_DEV_SERVER_HOST: "0.0.0.0"
    VITE_DEV_SERVER_PORT: "${EXT_PORT_NODE_DEV:-5173}"
    HOME: "/tmp"
    NPM_CONFIG_CACHE: "/tmp/.npm"
    MERCURE_URL: "http://mercure/.well-known/mercure"
    VITE_MERCURE_PUBLIC_URL: "http://127.0.0.1:${EXT_PORT_MERCURE_DEV:-3000}/.well-known/mercure"
  volumes:
    - ./frontend:/app/frontend
    - ./frontend/node_modules:/app/frontend/node_modules

############
# SERVICES #
############
services:

  #############
  # DATABASES #
  #############
  db-dev:
    <<: *db-base
    profiles: [ "dev" ]
    volumes:
      - db_dev_data:/var/lib/mysql
    restart: unless-stopped

  db-prod:
    <<: *db-base
    profiles: [ "prod" ]
    volumes:
      - db_prod_data:/var/lib/mysql
    restart: unless-stopped

  db-test:
    <<: *db-base
    profiles: [ "test" ]
    tmpfs:
      - /var/lib/mysql
    restart: "no"

  #################
  # DEV - PHP SET #
  #################
  php-dev:
    <<: [ *php-common, *build-dev ]
    profiles: [ "dev" ]
    volumes:
      - ./backend:/app/backend
    command: >
      sh -lc '
        php bin/console doctrine:database:drop --force --if-exists --env=dev &&
        php bin/console doctrine:database:create --if-not-exists --env=dev &&
        php bin/console doctrine:migrations:migrate --no-interaction --env=dev &&
        php bin/console foundry:load-story baseStory --no-interaction &&
        symfony server:start --port=8001 --listen-ip=0.0.0.0
      '
    depends_on:
      db-dev:
        condition: service_healthy
    restart: unless-stopped

  ##################
  # TEST - PHP SET #
  ##################
  php-test-runner:
    <<: [ *php-common, *build-test ]
    profiles: [ "test" ]
    depends_on:
      db-test:
        condition: service_healthy
    command: >
      sh -lc '
        php bin/console doctrine:database:drop --force --if-exists --env=test &&
        php bin/console doctrine:database:create --if-not-exists --env=test &&
        php bin/console doctrine:migrations:migrate --no-interaction --env=test &&
        php bin/console doctrine:fixtures:load --no-interaction --env=test &&
        php bin/phpunit
      '
    restart: "no"

  ##################
  # PROD - PHP SET #
  ##################
  web:
    image: ${PROD_IMAGE}
    <<: [ *php-common, *build-prod ]
    profiles: [ "prod" ]
    working_dir: /var/www/html
    user: "www-data:${HOST_GID:-1000}"
    depends_on:
      db-prod:
        condition: service_healthy
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    restart: unless-stopped
    healthcheck:
      <<: *health-defaults
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1/ || exit 1" ]
    command: >
      sh -lc '
        php bin/console doctrine:database:drop --force --if-exists --env=prod &&
        php bin/console doctrine:database:create --if-not-exists --env=prod &&
        php bin/console doctrine:migrations:migrate --no-interaction --env=prod &&
        /usr/sbin/apache2ctl -D FOREGROUND
      '

  ##############
  # NODE / DEV #
  ##############
  node-deps:
    <<: *node-common
    profiles: ["dev"]
    user: root
    command: >
      sh -lc '
        mkdir -p /app/frontend/node_modules;        
        npm ci;
        chown -R ${HOST_UID:-1000}:${HOST_GID:-1000} /app/frontend/node_modules;
      '
    restart: "no"

  node-dev:
    <<: *node-common
    profiles: [ "dev" ]
    depends_on:
      node-deps:
        condition: service_completed_successfully
    command: npm run dev -- --host 0.0.0.0 --port 5173
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173 || exit 1"]
    restart: unless-stopped

  #################
  # MERCURE / DEV #
  #################
  mercure-dev:
    profiles: [ "dev" ]
    image: dunglas/mercure:${MERCURE_VERSION:-v0.24.0}
    <<: *net
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: "!"
      MERCURE_SUBSCRIBER_JWT_KEY: "!"
      MERCURE_EXTRA_DIRECTIVES: |
        demo
        anonymous
        cors_origins *
        publish_origins *
#      MERCURE_EXTRA_DIRECTIVES: |
#        "anonymous
#        cors_origins http://localhost:5173 http://localhost:8000
#        publish_origins http://localhost:5173 http://localhost:8000
#        demo"
    volumes:
      - mercure_dev_data:/data
      - mercure_dev_config:/config
    healthcheck:
      <<: *health-defaults
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost/healthz" ]
    restart: unless-stopped

###########
# VOLUMES #
###########
volumes:
  db_dev_data:
  db_prod_data:
  composer_cache:
  mercure_dev_data:
  mercure_dev_config:

############
# NETWORKS #
############
networks:
  app_net:
    driver: bridge