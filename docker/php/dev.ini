;
; dev.ini
; Development overrides
;

display_errors = On
display_startup_errors = On
log_errors = On

error_reporting = E_ALL

memory_limit = -1

; Better DX
realpath_cache_size=4096K
realpath_cache_ttl=600

; Zend
zend.assertions = 1

xdebug.mode = off
xdebug.start_with_request = no

; OPCache
opcache.enable_cli=1