services:

  webserver:
    image: studybuddy:prod
    build:
      context: ../../.
      dockerfile: docker/production/webserver/webserver.dockerfile
      no_cache: true
      pull: true
    container_name: prod-webserver
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.0.32
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "127.0.0.1:3366:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data: