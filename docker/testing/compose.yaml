services:

  php:
    build:
      context: ../../.
      dockerfile: ./docker/testing/php/php.dockerfile
    working_dir: /app/backend
#    volumes:
#      - ../../backend/test/TestResults:/app/TestResults
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.0.32
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app_test
      MYSQL_USER: app_test
      MYSQL_PASSWORD: app_test
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 5s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/mysql