services:

  db:
    image: ${DATABASE_VERSION}
    env_file: ./docker/environment/${APP_ENV}/${APP_ENV}.db.env
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app_net

networks:
  app_net: