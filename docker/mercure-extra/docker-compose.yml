name: ${COMPOSE_PROJECT_NAME}

services:
  mercure:
    image: ${MERCURE_VERSION}
    user: "${UID}:${GID}"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    env_file: .env
    ports:
      - ${PORTS}
    volumes:
      - mercure_data:/data
      - mercure_config:/config

volumes:
  mercure_data:
  mercure_config:
