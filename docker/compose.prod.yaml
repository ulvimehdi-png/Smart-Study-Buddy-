services:

  db:
    ports:
      - "127.0.0.1:${EXT_PORT_DB_PROD:-3308}:3306"
    volumes:
      - sewt_prod_db_data:/var/lib/mysql

  webserver:
    image: ${PROD_IMAGE:-studybuddy:prod}
    build:
      dockerfile: ./docker/php/${APP_ENV}.dockerfile
    ports:
      - "127.0.0.1:${EXT_PORT_HTTP_PROD:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net

volumes:
  sewt_prod_db_data: