services:

  db:
    ports:
      - 127.0.0.1:${EXT_PORT_DB_DEV}:3306
    volumes:
      - sewt_dev_db:/var/lib/mysql

  php:
    build:
      dockerfile: ./docker/php/${APP_ENV}.dockerfile
    working_dir: /app/backend
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      COMPOSER_HOME: /tmp/composer
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    env_file: ./docker/environment/${APP_ENV}/${APP_ENV}.php.env
    ports:
      - 127.0.0.1:${EXT_PORT_PHP_DEV}:80
    volumes:
      - ./backend:/app/backend
      - ./docker/php/${APP_ENV}.ini:/usr/local/etc/php/conf.d/${APP_ENV}.ini
      - ./docker/scripts:/scripts
    command: /scripts/${APP_ENV}-entrypoint.sh
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net

  node:
    image: ${NODE_VERSION}
    working_dir: /app/frontend
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file: ./docker/environment/${APP_ENV}/${APP_ENV}.node.env
    ports:
      - 127.0.0.1:${EXT_PORT_NODE_DEV}:5173
    volumes:
      - ./frontend:/app/frontend
    command: sh -c "npm install && npm run dev -- --host --port 5173"
    networks:
      - app_net

  mercure:
    image: ${MERCURE_VERSION}
    env_file: ./docker/environment/${APP_ENV}/${APP_ENV}.mercure.env
    ports:
      - 127.0.0.1:${EXT_PORT_MERCURE_DEV}:80
    volumes:
      - sewt_dev_mercure_data:/data
      - sewt_dev_mercure_config:/config
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost/healthz" ]
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - app_net


volumes:
  sewt_dev_db:
  sewt_dev_mercure_data:
  sewt_dev_mercure_config: