name: sewt_dev_compose
services:

  db:
    ports:
      - "3307:3306"
    volumes:
      - sewt_dev_db_data:/var/lib/mysql

  php:
    working_dir: /app/backend
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
    env_file: "./backend/.env.dev"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/dev.ini
      - ./docker/scripts:/docker/scripts
    command: ["/docker/scripts/dev-entrypoint.sh"]

  node:
    image: node:25.9.0
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      VITE_MERCURE_PUBLIC_URL: 'http://mercure:3000/.well-known/mercure'
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host --port 5173"

  mercure:
    image: dunglas/mercure
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: "!"
      MERCURE_SUBSCRIBER_JWT_KEY: "!"
      #MERCURE_EXTRA_DIRECTIVES: |
      #  "anonymous
      #  cors_origins http://localhost:5173 http://localhost:8000
      #  publish_origins http://localhost:5173 http://localhost:8000
      #  demo"
      MERCURE_EXTRA_DIRECTIVES: |
        demo
        anonymous
        cors_origins *
        publish_origins *
    ports:
      - "3000:80"
    volumes:
      - sewt_dev_mercure_data:/data
      - sewt_dev_mercure_config:/config
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost/healthz" ]
      timeout: 5s
      retries: 5
      start_period: 60s


volumes:
  sewt_dev_db_data:
  sewt_dev_mercure_data:
  sewt_dev_mercure_config: