name: sewt_test_compose
services:

  db:
    container_name: sewt_test_db_container
    environment:
      MYSQL_DATABASE: app_test
      MYSQL_USER: app_test
      MYSQL_PASSWORD: app_test
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 5s
      timeout: 3s
      retries: 20

  php:
    container_name: sewt_test_php_container
    environment:
      APP_ENV: test
      APP_DEBUG: 0
      DATABASE_URL: "mysql://app_test:app_test@db:3306/app?serverVersion=8.0.32&charset=utf8mb4"
    volumes:
      - ./backend:/app/backend
      - ./docker/php/test.ini:/usr/local/etc/php/conf.d/test.ini
      - ./docker/scripts:/docker/scripts
    command: ["/docker/scripts/test-entrypoint.sh"]