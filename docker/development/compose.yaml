services:
  database:
    image: mysql:8.0.32
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/mysql:rw

  php:
    build:
      context: .
      dockerfile: ./php/php.dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../../backend:/app
      - ./php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
    working_dir: /app
    depends_on:
      - database
      - mercure
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
    env_file: "../../backend/.env.dev"
    command: php -S 0.0.0.0:8000 -t public

  node:
    image: node:25.9.0
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../../frontend:/app
    ports:
      - "5173:5173"
    env_file: "../../backend/.env.dev"
    command: npm run dev -- --host --port 5173

  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost/healthz" ]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "3000:80"
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: "!"
      MERCURE_SUBSCRIBER_JWT_KEY: "!"
      #MERCURE_EXTRA_DIRECTIVES: |
      #  "anonymous
      #  cors_origins http://localhost:5173 http://localhost:8000
      #  publish_origins http://localhost:5173 http://localhost:8000
      #  demo"
      MERCURE_EXTRA_DIRECTIVES: |
        demo
        anonymous
        cors_origins *
        publish_origins *

volumes:
  database_data:
  mercure_data:
  mercure_config: