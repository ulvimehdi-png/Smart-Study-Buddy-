image: composer:2.9.5

stages:
    - check

.ssh_setup:
    before_script:
        - mkdir -p ~/.ssh -m 700
        - eval $(ssh-agent -s)
        - chmod 400 "$SSH_PRIVATE_KEY"
        - ssh-add "$SSH_PRIVATE_KEY"
        - ssh-keyscan shell.studev.groept.be > ~/.ssh/known_hosts

ssh-check:
    stage: check
    only:
        - main
    script:
        - ssh a25sewt301@shell.studev.groept.be 'pwd && ls -la ~ && ls -la /var/www'