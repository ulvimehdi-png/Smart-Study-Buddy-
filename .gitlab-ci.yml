stages:
  - validate
  - test
  - build
  - smoke
  - deploy

default:
  tags:
    - local-shell
  interruptible: true

variables:
  BACKEND_DIR: "$CI_PROJECT_DIR/backend"
  FRONTEND_DIR: "$CI_PROJECT_DIR/frontend"
  DEPLOY_USER: "a25sewt301"
  DEPLOY_HOST: "sewt-shell"
  DEPLOY_PATH: "/var/www/html"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

#
# VALIDATE
#
validate_compose:
  stage: validate
  script:
    - docker version
    - docker compose version
    - make --version
    - curl --version
    - rsync --version
    - ssh -V
    - make config-check

#
# TEST STAGE
#
test_stack:
  stage: test
  variables:
    COMPOSE_PROJECT_NAME: "sewt_test_${CI_PIPELINE_ID}"
  script:
    - make test
  after_script:
    - make test-down || true
    - make fix-perms || true

smoke_dev_stack:
  stage: test
  variables:
    COMPOSE_PROJECT_NAME: "sewt_dev_${CI_PIPELINE_ID}"
  script:
    - make dev-down || true
    - make dev-up
    - make dev-smoke
  after_script:
    - make dev-down || true
    - make fix-perms || true

#
# BUILD STAGE
#
build_prod_artifact:
  stage: build
  variables:
    COMPOSE_PROJECT_NAME: "sewt_prod_build_${CI_PIPELINE_ID}"
    DEPLOY_ARTIFACT_DIR: ".deploy"
  script:
    - make prod-build
    - make prod-export
    - test -f .deploy/public/index.html
    - test -f .deploy/public/index.php
    - test -f .deploy/bin/console
    - test -d .deploy/vendor
  after_script:
    - make fix-perms || true
  artifacts:
    paths:
      - .deploy/
    expire_in: 1 hour


#
# SMOKE
#
smoke_prod_stack:
  stage: smoke
  variables:
    COMPOSE_PROJECT_NAME: "sewt_prod_smoke_${CI_PIPELINE_ID}"
  script:
    - make prod-down || true
    - make prod-build
    - make prod-up-detached-no-build
    - make prod-smoke
  after_script:
    - make prod-down || true
    - make fix-perms || true


#
# DEPLOY STAGE
#
deploy:
  stage: deploy
  needs:
    - job: build_prod_artifact
      artifacts: true
    - job: smoke_prod_stack
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - when: never
  before_script:
    - ssh -o BatchMode=yes -o ConnectTimeout=15 "$DEPLOY_HOST" "echo remote-ok"
  script:
    - test -f .deploy/public/index.html
    - test -f .deploy/public/index.php
    - test -f .deploy/bin/console
    - test -d .deploy/vendor

    - >
      rsync -rvz --delete-after
      --exclude=".git/"
      --exclude=".gitignore"
      --exclude=".env.local*"
      --exclude=".env.dev"
      --exclude=".env.test"
      --exclude="phpunit.dist.xml"
      --exclude="README.md"
      --exclude="tests/"
      --exclude="upload/"
      --exclude="var/cache/"
      --exclude="var/log/"
      ".deploy/"
      $DEPLOY_HOST:$DEPLOY_PATH/

    - ssh $DEPLOY_HOST "
      cd $DEPLOY_PATH/ &&
      composer clear-cache &&
      php bin/console cache:clear --env=prod --no-debug &&
      php bin/console cache:warmup --env=prod
      "

    - ssh $DEPLOY_HOST "
      cd $DEPLOY_PATH/ &&
      php bin/console doctrine:migrations:migrate --no-interaction &&
      php bin/console cache:warmup --env=prod
      "
  environment:
    name: production