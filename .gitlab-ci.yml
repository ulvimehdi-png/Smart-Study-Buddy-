image: composer:2.9.5

before_script:
    - echo $PWD
    - export APP_ENV=prod
    - export BACKEND_DIR=$PWD/backend
    - export FRONTEND_DIR=$PWD/frontend
    - echo $BACKEND_DIR && echo $FRONTEND_DIR
    - ls -la $BACKEND_DIR $FRONTEND_DIR
    - env
    - apk add --update nodejs npm
    - apk add rsync
    - mkdir -p ~/.ssh -m 700
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan shell.studev.groept.be > ~/.ssh/known_hosts
    - ssh a25sewt301@shell.studev.groept.be 'pwd && ls -la ~ && ls -la /var/www'

deploy:
    script:
        # BACKEND
        - cd $BACKEND_DIR
        - composer validate --no-check-publish
        - composer install -n --no-dev --no-scripts --no-cache
        - php bin/console lint:yaml config
        - php bin/console lint:container
        - cd ..
        # FRONTEND
        - cd $FRONTEND_DIR
        - npm install
        - npm run build
        - cd ..
        # DEPLOY
        - rsync -rv --exclude=".git/" --exclude=".env" --exclude="upload" --delete ./ a25sewt301@shell.studev.groept.be:/var/www/html
