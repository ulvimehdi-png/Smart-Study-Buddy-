#
# GENERAL SETUP
#
stages:
  - validate
  - test
  - build
  - deploy

default:
  tags:
    - local-shell
  interruptible: true

variables:
  DEPLOY_USER: "a25sewt301"
  # DEPLOY_HOST ==> see .ssh/config
  DEPLOY_HOST: "sewt-shell"
  DEPLOY_PATH: "/var/www/html"
  HOST_UID: "1001"
  HOST_GID: "1001"
  ARTIFACTS_DIR: ".artifacts"
  EXPORT_DIR: ${ARTIFACTS_DIR}/export
  COVERAGE_DIR: ${ARTIFACTS_DIR}/coverage
  #PROD_ENV_LOCAL_FILE must be set in GL cicd

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

#
# STAGE - VALIDATE
# Just a quick check to see if all tools are available
#
validate_compose:
  stage: validate
  script:
    - docker version
    - docker compose version
    - make --version
    - curl --version
    - rsync --version
    - ssh -V
    - make config-check

#
# STAGE - TEST
# -- no more dev smoke for overall sanity of dev setup
#
#smoke_dev_stack:
#  stage: test
#  script:
#    - make dev-ci

test_coverage_artifact:
  stage: test
  script:
    - make test-ci
  artifacts:
    paths:
      - ${COVERAGE_DIR}
    expire_in: 1 hour
  allow_failure: false

#
# STAGE - BUILD
#
build_prod_artifact:
  stage: build
  script:
    - make prod-ci
  artifacts:
    paths:
      - ${EXPORT_DIR}
    expire_in: 1 hour

#
# STAGE - DEPLOY
#
deploy:
  stage: deploy
  needs:
    - job: build_prod_artifact
      artifacts: true
    - job: test_coverage_artifact
      artifacts: true
  resource_group: studev-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      variables:
        DEPLOY_ENVIRONMENT: "production"
    - if: '$CI_COMMIT_BRANCH == "integration/ci-cd-all"'
      when: manual
      variables:
        DEPLOY_ENVIRONMENT: "production-deploy-test"
    - when: never
  script:
    - make deploy-ci
  environment:
    name: $DEPLOY_ENVIRONMENT