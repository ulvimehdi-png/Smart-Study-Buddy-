image: composer:2.9.5

stages:
    - deploy

variables:
    APP_ENV: prod
    BASE_URL: /public
    BACKEND_DIR: "$CI_PROJECT_DIR/backend"
    FRONTEND_DIR: "$CI_PROJECT_DIR/frontend"
    DEPLOY_USER: "a25sewt301"
    DEPLOY_HOST: "shell.studev.groept.be"
    DEPLOY_PATH: "/var/www/html"

before_script:
    - mkdir -p ~/.ssh -m 700
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan "$DEPLOY_HOST" > ~/.ssh/known_hosts
    - apk add --no-cache nodejs npm rsync

deploy:
    stage: deploy
    only:
        - main
    script:
        # BACKEND
        - cd "$BACKEND_DIR"
        - composer validate --no-check-publish
        - composer install --no-interaction --no-dev --no-scripts --no-ansi --optimize-autoloader --no-progress
        - php bin/console lint:yaml config
        - php bin/console lint:container --env=prod

        # FRONTEND
        - cd "$FRONTEND_DIR"
        - npm ci
        - npm run build

        # DEPLOY
        - >
            rsync -rv --delete \
            --exclude="index.php" \
            --exclude=".htaccess" \
            "$FRONTEND_DIR/dist/" \
            "$BACKEND_DIR/public/"

        - >
            rsync -rvz --delete \
            --exclude=".git/" \
            --exclude=".editorconfig" \
            --exclude=".gitignore" \
            --exclude=".env" \
            --exclude=".env.dev" \
            --include=".env.test" \
            --exclude="phpunit.dist.xml" \
            --exclude="README.md" \
            --exclude="tests/" \
            --exclude="upload/" \
            "$BACKEND_DIR/" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"