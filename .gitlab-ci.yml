#
# PORT DEFINITIONS
#
.setup_ci_ports: &setup_ci_ports |
  set -e

  port_base=$((20000 + (${CI_PIPELINE_ID:-0} % 1000) * 10))

  cat > .ci.ports.env <<EOF
  EXT_PORT_NODE_DEV=$((port_base + 0))
  EXT_PORT_PHP_DEV=$((port_base + 1))
  EXT_PORT_MERCURE_DEV=$((port_base + 2))
  EXT_PORT_DB_DEV=$((port_base + 3))
  EXT_PORT_HTTP_PROD=$((port_base + 4))
  EXT_PORT_DB_PROD=$((port_base + 5))
  EOF

  echo "Generated CI port file:"
  cat .ci.ports.env

.with_ci_ports: &with_ci_ports |
  set -e
  set -a
  . ./.ci.ports.env
  set +a

#
# GENERAL SETUP
#
stages:
  - validate
  - test
  - build
  - deploy

default:
  tags:
    - local-shell
  interruptible: true

variables:
  DEPLOY_USER: "a25sewt301"
  # DEPLOY_HOST ==> see .ssh/config
  DEPLOY_HOST: "sewt-shell"
  DEPLOY_PATH_PROD: "/var/www/html"
  PROD_IMAGE: "studybuddy:prod"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

#
# STAGE - VALIDATE
#
validate_compose:
  stage: validate
  script:
    - docker version
    - docker compose version
    - make --version
    - curl --version
    - rsync --version
    - ssh -V
    - make config-check

#
# STAGE - TEST
#
test_stack:
  stage: test
  variables:
    COMPOSE_PROJECT_NAME: "sewt_test_${CI_PIPELINE_ID}"
  script:
    - make test
  after_script:
    - make test-down || true
    - make fix-perms || true

smoke_dev_stack:
  stage: test
  resource_group: local-docker-host-ports
  variables:
    COMPOSE_PROJECT_NAME: "sewt_dev_${CI_PIPELINE_ID}"
  script:
    - *setup_ci_ports
    - *with_ci_ports
    - make print-ports
    - make dev-down || true
    - make dev-up
    - docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
    - make dev-smoke
  after_script:
    - |
      if [ -f .ci.ports.env ]; then
        set -a
        . ./.ci.ports.env
        set +a
      fi
    - make dev-down || true
    - make fix-perms || true

#
# STAGE - BUILD
#
build_prod_artifact:
  stage: build
  resource_group: local-docker-host-ports
  variables:
    COMPOSE_PROJECT_NAME: "sewt_prod_build_${CI_PIPELINE_ID}"
    DEPLOY_ARTIFACT_DIR: ".deploy"
    PROD_IMAGE: "studybuddy:ci-${CI_PIPELINE_ID}"
  script:
    - *setup_ci_ports
    - *with_ci_ports
    - make print-ports
    - make prod-reset || true
    - make prod-build
    - make prod-up-detached-no-build
    - docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
    - make prod-smoke
    - make prod-export

    - test -f .deploy/public/index.html
    - test -f .deploy/public/index.php
    - test -f .deploy/bin/console
    - test -d .deploy/vendor
  after_script:
    - |
      if [ -f .ci.ports.env ]; then
        set -a
        . ./.ci.ports.env
        set +a
      fi
      make prod-reset || true
      docker image rm "studybuddy:ci-${CI_PIPELINE_ID}" || true
      make fix-perms || true
  artifacts:
    paths:
      - .deploy/
    expire_in: 1 hour

#
# STAGE - DEPLOY
#
deploy:
  stage: deploy
  needs:
    - job: build_prod_artifact
      artifacts: true
  resource_group: studev-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      variables:
        DEPLOY_ENVIRONMENT: "production"

    - if: '$CI_COMMIT_BRANCH == "integration/ci-cd-all"'
      when: manual
      variables:
        DEPLOY_ENVIRONMENT: "production-deploy-test"

    - when: never
  before_script:
    - ssh -o BatchMode=yes -o ConnectTimeout=15 "$DEPLOY_HOST" "echo remote-ok"
  script:
    - test -f .deploy/public/index.html
    - test -f .deploy/public/index.php
    - test -f .deploy/bin/console
    - test -d .deploy/vendor

    - >
      rsync -rvz --delete-after
      --exclude=".git/"
      --exclude=".gitignore"
      --exclude=".env*"
      --exclude="phpunit.dist.xml"
      --exclude="README.md"
      --exclude="tests/"
      --exclude="upload/"
      --exclude="var/cache/"
      --exclude="var/log/"
      ".deploy/"
      $DEPLOY_HOST:$DEPLOY_PATH/

    - >
      ssh "$DEPLOY_HOST" "
      set -e;
      cat > '$DEPLOY_PATH/.env.local' < "$PROD_ENV_LOCAL_FILE"
      chmod 600 '$DEPLOY_PATH.env.local';
      test -f '$DEPLOY_PATH/.env.local';
      "

    - >
      ssh "$DEPLOY_HOST" "
      set -e;
      cd '$DEPLOY_PATH';
      php bin/console doctrine:migrations:migrate --no-interaction --env=prod;
      php bin/console cache:clear --env=prod --no-debug;
      php bin/console cache:warmup --env=prod
      "

  environment:
    name: $DEPLOY_ENVIRONMENT