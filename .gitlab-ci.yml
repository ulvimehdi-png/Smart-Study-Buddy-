#
# GENERAL SETUP
#
stages:
  - validate
  - test
  - build
  - deploy

default:
  tags:
    - local-shell
  interruptible: true

variables:
  DEPLOY_USER: "a25sewt301"
  # DEPLOY_HOST ==> see .ssh/config
  DEPLOY_HOST: "sewt-shell"
  DEPLOY_PATH: "/var/www/html"
  HOST_UID: "1001"
  HOST_GID: "1001"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

#
# STAGE - VALIDATE
#
validate_compose:
  stage: validate
  script:
    - docker version
    - docker compose version
    - make --version
    - curl --version
    - rsync --version
    - ssh -V
    - make config-check

#
# STAGE - TEST
#
test_stack:
  stage: test
  variables:
    TEST_PROJECT: "studybuddy_test_${CI_PIPELINE_ID}"
  script:
    - make test
  after_script:
    - make test-down || true
  allow_failure: true
  # NEEDS TO BE DELETED AFTER TESTS ARE FIXED !!!

smoke_dev_stack:
  stage: test
  variables:
    COMPOSE_PROJECT_NAME: "sewt_dev_${CI_PIPELINE_ID}"
  script:
    - make dev-reset || true
    - make dev-up
    - make dev-smoke
  after_script:
    - make dev-down || true

#
# STAGE - BUILD
#
build_prod_artifact:
  stage: build
  variables:
    PROD_PROJECT: "studybuddy_prod_${CI_PIPELINE_ID}"
    PROD_IMAGE: "studybuddy:prod-${CI_PIPELINE_ID}"
    ARTIFACTS_DIR: ".deploy"
  script:
    - make prod-reset || true
    - make prod-build
    - make prod-up-detached
    #- make prod-smoke
    - make prod-export
    - test -f ${ARTIFACTS_DIR}/public/index.html
    - test -f ${ARTIFACTS_DIR}/public/index.php
    - test -f ${ARTIFACTS_DIR}/bin/console
    - test -d ${ARTIFACTS_DIR}/vendor
  after_script:
    - make prod-reset || true
    - docker image rm ${PROD_IMAGE} || true
  artifacts:
    paths:
      - ${ARTIFACTS_DIR}/
    expire_in: 1 hour

#
# STAGE - DEPLOY
#
deploy:
  stage: deploy
  needs:
    - job: build_prod_artifact
      artifacts: true
  resource_group: studev-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      variables:
        DEPLOY_ENVIRONMENT: "production"

    - if: '$CI_COMMIT_BRANCH == "integration/ci-cd-all"'
      when: manual
      variables:
        DEPLOY_ENVIRONMENT: "production-deploy-test"

    - when: never
  before_script:
    - ssh -o BatchMode=yes -o ConnectTimeout=15 "$DEPLOY_HOST" "echo remote-ok"
  script:
    - test -f .deploy/public/index.html
    - test -f .deploy/public/index.php
    - test -f .deploy/bin/console
    - test -d .deploy/vendor

    - >
      rsync -rvz --delete-after
      --exclude=".env*"
      --exclude="upload/"
      --exclude="var/cache/"
      --exclude="var/log/"
      ".deploy/"
      $DEPLOY_HOST:$DEPLOY_PATH/

    - echo "APP_ENV=prod" | ssh "$DEPLOY_HOST" "cat > '$DEPLOY_PATH/.env'"
    - ssh "$DEPLOY_HOST" "cat > '$DEPLOY_PATH/.env.local'" < "$PROD_ENV_LOCAL_FILE"
    - ssh "$DEPLOY_HOST" "chmod 644 '$DEPLOY_PATH/.env' '$DEPLOY_PATH/.env.local' && test -f '$DEPLOY_PATH/.env.local'"

    - >
      ssh "$DEPLOY_HOST" "
      set -e;
      cd '$DEPLOY_PATH';
      php bin/console doctrine:migrations:migrate --no-interaction --env=prod;
      php bin/console cache:clear --env=prod --no-debug;
      php bin/console cache:warmup --env=prod
      "

  environment:
    name: $DEPLOY_ENVIRONMENT